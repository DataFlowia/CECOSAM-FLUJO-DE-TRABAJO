<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CECOSAM — Centro de Exalumnos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-deep: #0a0f1e;
    --bg-purple: #1a0a2e;
    --bg-elevated: rgba(10, 15, 30, 0.72);
    --bg-card: rgba(15, 20, 40, 0.78);
    --bg-card-hover: rgba(20, 28, 55, 0.85);
    --border: rgba(100, 80, 180, 0.18);
    --border-hover: rgba(120, 100, 220, 0.3);
    --text-primary: #E8E6F0;
    --text-secondary: #A09EC0;
    --text-muted: #6B6890;
    --accent-legal: #6FA8DC;
    --accent-info: #4FD1A5;
    --accent-fin: #A9D18E;
    --accent-mkt: #F2A7C0;
    --accent-com: #F2995F;
    --accent-rrhh: #B9A6E8;
    --accent-infra: #F0C46B;
    --accent-gob: #B9B6AA;
    --gradient-start: #A855F7;
    --gradient-mid: #3B82F6;
    --gradient-end: #EAB308;
    --neon-cyan: #00d4ff;
    --neon-purple: #a855f7;
    --shadow-glow: rgba(168, 85, 247, 0.1);
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Roboto', system-ui, -apple-system, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    position: relative;
  }

  /* ===== ANIMATED GRADIENT BACKGROUND ===== */
  .bg-gradient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg-purple) 50%, var(--bg-deep) 100%);
    background-size: 400% 400%;
    animation: gradientShift 12s ease-in-out infinite;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ===== NEON ORBS ===== */
  .bg-orb {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    filter: blur(80px); opacity: 0.35;
  }
  .bg-orb.cyan {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,212,255,0.25) 0%, transparent 70%);
    top: -100px; left: -100px;
    animation: orbFloat1 18s ease-in-out infinite;
  }
  .bg-orb.purple {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(168,85,247,0.22) 0%, transparent 70%);
    bottom: -150px; right: -100px;
    animation: orbFloat2 22s ease-in-out infinite;
  }
  .bg-orb.cyan2 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(0,212,255,0.15) 0%, transparent 70%);
    top: 40%; right: 10%;
    animation: orbFloat3 16s ease-in-out infinite;
  }
  @keyframes orbFloat1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,80px) scale(1.1)} }
  @keyframes orbFloat2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,-60px) scale(1.15)} }
  @keyframes orbFloat3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-30px,40px) scale(0.9)} }

  /* ===== JESUIT SYMBOL WATERMARK ===== */
  .jesuit-watermark {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.035;
    animation: watermarkPulse 8s ease-in-out infinite;
  }
  .jesuit-watermark svg {
    width: min(70vw, 600px); height: min(70vw, 600px);
    max-width: 600px; max-height: 600px;
  }
  @keyframes watermarkPulse {
    0%,100% { opacity: 0.025; transform: scale(1); }
    50% { opacity: 0.05; transform: scale(1.02); }
  }

  /* ===== HEADER ===== */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 15, 30, 0.82);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(16px, 4vw, 40px);
  }
  .header-inner {
    max-width: 900px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .logo {
    font-family: 'Roboto', sans-serif;
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 900;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-mid), var(--gradient-end));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
  }
  .logo::after {
    content: 'CECOSAM';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--gradient-start), var(--gradient-mid), var(--gradient-end));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: blur(14px); opacity: 0.45;
    pointer-events: none;
  }
  .header-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-muted);
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
  }

  /* ===== MAIN ===== */
  .main {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto;
    padding: clamp(24px, 5vw, 40px) clamp(16px, 4vw, 40px) clamp(40px, 8vw, 80px);
  }

  /* ===== HERO SECTION ===== */
  .hero {
    margin-bottom: 32px;
    animation: fadeUp 0.6s ease-out both;
  }
  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .hero-eyebrow::before {
    content: ''; width: 24px; height: 1px; background: var(--text-muted);
  }
  .hero h1 {
    font-family: 'Roboto', sans-serif;
    font-size: clamp(30px, 7vw, 44px);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .hero h1 span {
    background: linear-gradient(135deg, #A78BFA, #60A5FA);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero-sub {
    font-family: 'Roboto', sans-serif;
    font-size: 15px; font-weight: 400; color: var(--text-secondary); max-width: 480px;
    line-height: 1.6;
  }

  /* ===== STATS BAR ===== */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr) 1.5fr;
    gap: 12px;
    margin-bottom: 28px;
    animation: fadeUp 0.6s 0.1s ease-out both;
  }
  @media (max-width: 640px) {
    .stats-bar { grid-template-columns: repeat(3, 1fr); }
    .stats-bar .stat-progress { grid-column: 1 / -1; }
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 14px;
    text-align: center;
    transition: var(--transition);
    position: relative; overflow: hidden;
    backdrop-filter: blur(8px);
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-cyan));
    opacity: 0; transition: var(--transition);
  }
  .stat-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
  .stat-card:hover::before { opacity: 1; }
  .stat-value {
    font-family: 'Roboto', sans-serif;
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(180deg, var(--text-primary), var(--text-secondary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-label {
    font-family: 'Roboto', sans-serif;
    font-size: 11px; font-weight: 500; color: var(--text-muted);
    margin-top: 6px; letter-spacing: 0.04em;
  }
  .stat-progress {
    display: flex; flex-direction: column; justify-content: center; gap: 8px;
    padding: 14px 18px; text-align: left;
  }
  .progress-header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .progress-header span { font-family: 'Roboto', sans-serif; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .progress-header strong {
    font-family: 'Roboto', sans-serif; font-size: 18px; font-weight: 900;
    color: var(--text-primary);
  }
  .progress-track {
    height: 6px; background: rgba(255,255,255,0.06); border-radius: 999px;
    overflow: hidden; position: relative;
  }
  .progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-cyan));
    background-size: 200% 100%;
    animation: progressShine 3s linear infinite;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .progress-fill::after {
    content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 30px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    border-radius: 999px;
    animation: shimmer 2s ease-in-out infinite;
  }
  @keyframes shimmer { 0%,100%{opacity:0} 50%{opacity:1} }
  @keyframes progressShine { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

  /* ===== FILTERS ===== */
  .filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 24px;
    animation: fadeUp 0.6s 0.15s ease-out both;
  }
  .filter-select {
    appearance: none; -webkit-appearance: none;
    font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 500;
    padding: 10px 36px 10px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);
    cursor: pointer; transition: var(--transition);
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238B8AA3' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 12px center;
    backdrop-filter: blur(8px);
  }
  .filter-select:focus {
    outline: none; border-color: var(--neon-cyan);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.12);
  }
  .filter-select:hover { border-color: var(--border-hover); }
  .btn-toggle {
    font-family: 'Roboto', sans-serif; font-size: 13px; font-weight: 700;
    padding: 10px 18px; border-radius: var(--radius-sm); cursor: pointer;
    border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary);
    transition: var(--transition); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
    backdrop-filter: blur(8px);
  }
  .btn-toggle:hover {
    border-color: var(--neon-cyan); color: var(--text-primary);
    background: rgba(0,212,255,0.08);
    box-shadow: 0 0 20px rgba(0,212,255,0.08);
  }
  .btn-toggle:active { transform: scale(0.97); }

  /* ===== GRID ===== */
  .grid {
    display: flex; flex-direction: column; gap: 14px;
    animation: fadeUp 0.6s 0.2s ease-out both;
  }

  /* ===== AREA CARD ===== */
  .area-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: var(--transition);
    position: relative;
    backdrop-filter: blur(12px);
  }
  .area-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--accent-color);
    opacity: 0.6; transition: var(--transition);
  }
  .area-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 8px 32px var(--shadow-glow), 0 0 0 1px var(--border-hover);
  }
  .area-card:hover::before { opacity: 1; }

  .area-header {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    position: relative;
  }
  .area-header::after {
    content: ''; position: absolute; bottom: 0; left: 20px; right: 20px; height: 1px;
    background: var(--border); opacity: 0;
    transition: var(--transition);
  }
  .area-card.open .area-header::after { opacity: 1; }

  .area-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent-color);
    box-shadow: 0 0 12px var(--accent-color-glow);
    flex-shrink: 0; transition: var(--transition);
  }
  .area-card:hover .area-dot { transform: scale(1.2); }

  .area-title {
    font-family: 'Roboto', sans-serif;
    font-size: 17px; font-weight: 700;
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .area-meta {
    display: flex; align-items: center; gap: 14px;
    flex-shrink: 0;
  }
  .area-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 500;
    color: var(--text-muted);
    padding: 4px 10px; border-radius: 999px;
    background: var(--bg-elevated); border: 1px solid var(--border);
  }
  .area-count span { color: var(--text-secondary); }
  .area-chevron {
    width: 20px; height: 20px; color: var(--text-muted);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
  }
  .area-card.open .area-chevron { transform: rotate(180deg); }

  .area-progress {
    height: 4px; background: rgba(255,255,255,0.05);
    margin: 0 20px 14px; border-radius: 999px; overflow: hidden;
    opacity: 0; transform: translateY(-4px);
    transition: all 0.3s ease;
  }
  .area-card.open .area-progress { opacity: 1; transform: translateY(0); }
  .area-progress-fill {
    height: 100%; border-radius: 999px;
    background: var(--accent-color);
    box-shadow: 0 0 8px var(--accent-color-glow);
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ===== TASK LIST ===== */
  .task-list {
    max-height: 0; overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    opacity: 0;
  }
  .area-card.open .task-list {
    max-height: 2000px; opacity: 1;
  }
  .task-list-inner {
    padding: 0 16px 16px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .task-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: var(--transition);
    position: relative; overflow: hidden;
  }
  .task-item::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent-color); opacity: 0; transition: var(--transition);
    border-radius: 0 2px 2px 0;
  }
  .task-item:hover {
    border-color: var(--border-hover);
    background: rgba(255,255,255,0.06);
    transform: translateX(2px);
  }
  .task-item:hover::before { opacity: 0.5; }

  .task-content { flex: 1; min-width: 0; }
  .task-title {
    font-family: 'Roboto', sans-serif;
    font-size: 14px; font-weight: 500; line-height: 1.5;
    color: var(--text-primary);
    word-break: break-word;
  }
  .task-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    margin-top: 6px;
  }
  .task-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
    padding: 3px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.04); color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .task-tag.resp { color: var(--accent-color); border-color: rgba(255,255,255,0.08); }

  .task-status {
    font-family: 'Roboto', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid transparent; white-space: nowrap;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0; margin-top: 2px;
    position: relative; overflow: hidden;
  }
  .task-status::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s ease;
  }
  .task-status:hover::after { transform: translateX(100%); }
  .task-status:active { transform: scale(0.95); }

  .status-pendiente {
    background: rgba(255,255,255,0.04); color: var(--text-muted);
    border-color: var(--border);
  }
  .status-pendiente:hover { background: rgba(255,255,255,0.08); color: var(--text-secondary); }

  .status-curso {
    background: rgba(79,209,165,0.1); color: #6EE7B7;
    border-color: rgba(79,209,165,0.2);
    box-shadow: 0 0 12px rgba(79,209,165,0.08);
  }
  .status-curso:hover { background: rgba(79,209,165,0.15); box-shadow: 0 0 16px rgba(79,209,165,0.12); }

  .status-completado {
    background: rgba(169,209,142,0.12); color: #A3E635;
    border-color: rgba(169,209,142,0.25);
    box-shadow: 0 0 12px rgba(169,209,142,0.08);
  }
  .status-completado:hover { background: rgba(169,209,142,0.18); box-shadow: 0 0 16px rgba(169,209,142,0.12); }

  .status-bloqueado {
    background: rgba(232,145,132,0.1); color: #FCA5A5;
    border-color: rgba(232,145,132,0.2);
    box-shadow: 0 0 12px rgba(232,145,132,0.06);
  }
  .status-bloqueado:hover { background: rgba(232,145,132,0.15); box-shadow: 0 0 16px rgba(232,145,132,0.1); }

  .empty-state {
    text-align: center; padding: 32px 20px; color: var(--text-muted);
    font-size: 13px;
  }
  .empty-state svg {
    width: 40px; height: 40px; margin-bottom: 10px; opacity: 0.3;
  }

  /* ===== FOOTER ===== */
  .footer {
    position: relative; z-index: 1;
    border-top: 1px solid var(--border);
    background: rgba(10, 15, 30, 0.7);
    backdrop-filter: blur(16px);
    padding: 28px clamp(16px, 4vw, 40px);
    text-align: center;
  }
  .footer-inner {
    max-width: 900px; margin: 0 auto;
  }
  .footer-email {
    font-family: 'Roboto', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .footer-email::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-info);
    box-shadow: 0 0 8px var(--accent-info);
  }
  .footer-name {
    font-family: 'Roboto', sans-serif;
    font-size: 14px; font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .footer-divider {
    width: 32px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-hover), transparent);
    margin: 14px auto;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse-dot {
    0%,100% { box-shadow: 0 0 0 0 var(--accent-color-glow); }
    50% { box-shadow: 0 0 0 6px transparent; }
  }
  .area-dot.pulse { animation: pulse-dot 2s ease-in-out infinite; }

  /* Stagger children */
  .grid .area-card {
    opacity: 0; animation: fadeUp 0.5s ease-out forwards;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  /* ===== MOBILE ===== */
  @media (max-width: 480px) {
    .header-inner { height: 56px; }
    .header-badge { display: none; }
    .hero { margin-bottom: 24px; }
    .hero h1 { font-size: 28px; }
    .stats-bar { gap: 8px; }
    .stat-card { padding: 14px 10px; }
    .stat-value { font-size: 26px; }
    .stat-label { font-size: 10px; }
    .filters { gap: 8px; }
    .filter-select, .btn-toggle { flex: 1; font-size: 13px; padding: 11px 12px; }
    .area-header { padding: 16px 14px; gap: 10px; }
    .area-title { font-size: 15px; }
    .area-meta { gap: 8px; }
    .area-count { font-size: 11px; padding: 3px 8px; }
    .task-item { padding: 12px 12px; gap: 10px; }
    .task-title { font-size: 13.5px; }
    .task-status { font-size: 10.5px; padding: 5px 11px; }
    .jesuit-watermark svg { width: 90vw; height: 90vw; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- Animated gradient background -->
<div class="bg-gradient"></div>

<!-- Neon orbs -->
<div class="bg-orb cyan"></div>
<div class="bg-orb purple"></div>
<div class="bg-orb cyan2"></div>

<!-- Jesuit symbol watermark -->
<div class="jesuit-watermark">
  <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Sun rays -->
    <g stroke="currentColor" stroke-width="1.2" opacity="0.6">
      <line x1="200" y1="20" x2="200" y2="60"/>
      <line x1="200" y1="340" x2="200" y2="380"/>
      <line x1="20" y1="200" x2="60" y2="200"/>
      <line x1="340" y1="200" x2="380" y2="200"/>
      <line x1="73" y1="73" x2="101" y2="101"/>
      <line x1="299" y1="299" x2="327" y2="327"/>
      <line x1="73" y1="327" x2="101" y2="299"/>
      <line x1="299" y1="101" x2="327" y2="73"/>
      <line x1="127" y1="35" x2="145" y2="70"/>
      <line x1="255" y1="330" x2="273" y2="365"/>
      <line x1="35" y1="273" x2="70" y2="255"/>
      <line x1="330" y1="145" x2="365" y2="127"/>
      <line x1="35" y1="127" x2="70" y2="145"/>
      <line x1="330" y1="255" x2="365" y2="273"/>
      <line x1="127" y1="365" x2="145" y2="330"/>
      <line x1="255" y1="70" x2="273" y2="35"/>
    </g>
    <!-- Outer circle -->
    <circle cx="200" cy="200" r="145" stroke="currentColor" stroke-width="2" opacity="0.5"/>
    <!-- Inner circle -->
    <circle cx="200" cy="200" r="105" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
    <!-- IHS letters -->
    <text x="200" y="225" text-anchor="middle" font-family="serif" font-size="72" font-weight="bold" fill="currentColor" opacity="0.7">IHS</text>
    <!-- Cross above H -->
    <g stroke="currentColor" stroke-width="2.5" opacity="0.7">
      <line x1="200" y1="115" x2="200" y2="155"/>

    </g>
    <!-- Three nails below -->
    <g stroke="currentColor" stroke-width="2" opacity="0.6">
      <line x1="170" y1="255" x2="170" y2="275"/>
      <line x1="165" y1="260" x2="175" y2="260"/>
      <line x1="200" y1="255" x2="200" y2="280"/>
      <line x1="192" y1="262" x2="208" y2="262"/>
      <line x1="230" y1="255" x2="230" y2="275"/>
      <line x1="225" y1="260" x2="235" y2="260"/>
    </g>
    <!-- Decorative rays between circles -->
    <g stroke="currentColor" stroke-width="1" opacity="0.3">
      <line x1="200" y1="55" x2="200" y2="95"/>
      <line x1="200" y1="305" x2="200" y2="345"/>
      <line x1="55" y1="200" x2="95" y2="200"/>
      <line x1="305" y1="200" x2="345" y2="200"/>
    </g>
  </svg>
</div>

<header class="header">
  <div class="header-inner">
    <div class="logo">CECOSAM</div>
    <div class="header-badge">Plan de tareas</div>
  </div>
</header>

<main class="main">
  <section class="hero">
    <p class="hero-eyebrow">Centro de exalumnos · Semanas 1–16</p>
    <h1>Plan de <span>tareas</span></h1>
    <p class="hero-sub">Seguimiento integral del proyecto de constitución del Centro de Exalumnos San Mateo. Gestiona el avance por área y estado.</p>
  </section>

  <div class="stats-bar" id="statsBar"></div>

  <div class="filters" id="filters">
    <select class="filter-select" id="statusFilter" aria-label="Filtrar por estado"></select>
    <button class="btn-toggle" id="toggleAll" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      Colapsar todo
    </button>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-email">exalumnos@sanmateo.cl</div>
    <div class="footer-divider"></div>
    <div class="footer-name">Centro de Exalumnos</div>
  </div>
</footer>

<script>
(function() {
  'use strict';

  // ===== DATA =====
  const TASKS = [
    {area:"Legal",tarea:"Definir tipo de entidad y estructura legal (fundación, corporación, asociación)",resp:"Abogado",s:1,d:1,estado:"Pendiente"},
    {area:"Legal",tarea:"Redactar estatutos y escritura pública",resp:"Abogado",s:2,d:2,estado:"Pendiente"},
    {area:"Legal",tarea:"Inscribir la entidad y obtener RUT / personalidad jurídica",resp:"Abogado / Contador",s:4,d:1,estado:"Pendiente"},
    {area:"Legal",tarea:"Tramitar permisos municipales",resp:"Encargado legal",s:5,d:1,estado:"Pendiente"},
    {area:"Legal",tarea:"Regularizar situación tributaria (inicio de actividades, régimen)",resp:"Contador",s:5,d:1,estado:"Pendiente"},

    {area:"Informática",tarea:"Contratar dominio y hosting",resp:"TI",s:3,d:1,estado:"Pendiente"},
    {area:"Informática",tarea:"Configurar correo institucional",resp:"TI",s:3,d:1,estado:"Pendiente"},
    {area:"Informática",tarea:"Diseñar y publicar sitio web",resp:"TI / Diseñador",s:4,d:3,estado:"Pendiente"},
    {area:"Informática",tarea:"Construir base de datos de exalumnos",resp:"TI",s:4,d:2,estado:"Pendiente"},
    {area:"Informática",tarea:"Desarrollar app / formulario de censo",resp:"TI",s:6,d:2,estado:"Pendiente"},

    {area:"Finanzas",tarea:"Abrir cuenta bancaria institucional",resp:"Tesorero",s:4,d:1,estado:"Pendiente"},
    {area:"Finanzas",tarea:"Elaborar presupuesto de gastos e ingresos",resp:"Contador",s:5,d:2,estado:"Pendiente"},
    {area:"Finanzas",tarea:"Proyectar flujo de caja (12-24 meses)",resp:"Contador",s:6,d:2,estado:"Pendiente"},
    {area:"Finanzas",tarea:"Definir política de cuotas y donaciones",resp:"Directorio",s:7,d:1,estado:"Pendiente"},
    {area:"Finanzas",tarea:"Implementar sistema contable",resp:"Contador",s:7,d:2,estado:"Pendiente"},

    {area:"Recursos humanos",tarea:"Mapear especialistas requeridos por área",resp:"Directorio",s:1,d:1,estado:"Pendiente"},
    {area:"Recursos humanos",tarea:"Definir perfiles y dedicación (full-time / part-time / voluntario)",resp:"RRHH",s:2,d:1,estado:"Pendiente"},
    {area:"Recursos humanos",tarea:"Contratar coordinador general",resp:"RRHH",s:3,d:2,estado:"Pendiente"},
    {area:"Recursos humanos",tarea:"Contratar contador y asesor legal",resp:"RRHH",s:3,d:2,estado:"Pendiente"},
    {area:"Recursos humanos",tarea:"Contratar community manager",resp:"RRHH",s:6,d:2,estado:"Pendiente"},

    {area:"Marketing",tarea:"Definir identidad de marca",resp:"Marketing",s:6,d:2,estado:"Pendiente"},
    {area:"Marketing",tarea:"Seleccionar redes sociales prioritarias",resp:"Marketing",s:7,d:1,estado:"Pendiente"},
    {area:"Marketing",tarea:"Crear plan de contenidos",resp:"Marketing",s:8,d:1,estado:"Pendiente"},
    {area:"Marketing",tarea:"Configurar canales de comunicación (newsletter, WhatsApp)",resp:"Marketing",s:8,d:2,estado:"Pendiente"},
    {area:"Marketing",tarea:"Lanzar campaña de difusión inicial",resp:"Marketing",s:9,d:2,estado:"Pendiente"},

    {area:"Comercialización",tarea:"Definir catálogo de productos (charlas, talleres)",resp:"Coordinador",s:9,d:2,estado:"Pendiente"},
    {area:"Comercialización",tarea:"Establecer alianzas para bolsa de empleo",resp:"Coordinador",s:10,d:2,estado:"Pendiente"},
    {area:"Comercialización",tarea:"Diseñar programa de mentorías",resp:"Coordinador",s:11,d:2,estado:"Pendiente"},
    {area:"Comercialización",tarea:"Definir membresías premium",resp:"Directorio",s:11,d:1,estado:"Pendiente"},
    {area:"Comercialización",tarea:"Planificar primer evento de networking",resp:"Coordinador",s:12,d:2,estado:"Pendiente"},

    {area:"Infraestructura",tarea:"Definir necesidad de oficina / espacio físico",resp:"Directorio",s:1,d:1,estado:"Pendiente"},
    {area:"Infraestructura",tarea:"Buscar y contratar el espacio",resp:"Administración",s:2,d:2,estado:"Pendiente"},
    {area:"Infraestructura",tarea:"Adquirir equipamiento (PC, mobiliario)",resp:"Administración",s:4,d:1,estado:"Pendiente"},
    {area:"Infraestructura",tarea:"Instalar servicios básicos e internet",resp:"Administración",s:4,d:1,estado:"Pendiente"},
    {area:"Infraestructura",tarea:"Habilitar señalética e imagen del espacio",resp:"Administración",s:5,d:1,estado:"Pendiente"},

    {area:"Gobernanza / Otros",tarea:"Constituir comité / mesa directiva",resp:"Directorio",s:1,d:1,estado:"Pendiente"},
    {area:"Gobernanza / Otros",tarea:"Establecer alianza con la universidad de origen",resp:"Directorio",s:2,d:3,estado:"Pendiente"},
    {area:"Gobernanza / Otros",tarea:"Definir plan de sostenibilidad a largo plazo",resp:"Directorio",s:12,d:3,estado:"Pendiente"},
    {area:"Gobernanza / Otros",tarea:"Revisión y ajuste general del proyecto",resp:"Directorio",s:15,d:2,estado:"Pendiente"},
    {area:"Gobernanza / Otros",tarea:"Lanzamiento oficial del centro de exalumnos",resp:"Directorio",s:16,d:1,estado:"Pendiente"},
  ].map((t, i) => Object.assign({id: i}, t));

  const AREA_CONFIG = {
    "Legal":            { color: "#6FA8DC", glow: "rgba(111,168,220,0.35)" },
    "Informática":      { color: "#4FD1A5", glow: "rgba(79,209,165,0.35)" },
    "Finanzas":         { color: "#A9D18E", glow: "rgba(169,209,142,0.35)" },
    "Marketing":        { color: "#F2A7C0", glow: "rgba(242,167,192,0.35)" },
    "Comercialización": { color: "#F2995F", glow: "rgba(242,153,95,0.35)" },
    "Recursos humanos": { color: "#B9A6E8", glow: "rgba(185,166,232,0.35)" },
    "Infraestructura":  { color: "#F0C46B", glow: "rgba(240,196,107,0.35)" },
    "Gobernanza / Otros": { color: "#B9B6AA", glow: "rgba(185,182,170,0.35)" }
  };

  const AREAS = [...new Set(TASKS.map(t => t.area))];
  const STATUSES = ["Pendiente", "En curso", "Completado", "Bloqueado"];
  const STATUS_CYCLE = {"Pendiente":"En curso","En curso":"Completado","Completado":"Bloqueado","Bloqueado":"Pendiente"};
  const STATUS_CLASS = {"Pendiente":"status-pendiente","En curso":"status-curso","Completado":"status-completado","Bloqueado":"status-bloqueado"};

  // ===== STATE =====
  const state = {
    filter: "Todos",
    openAreas: new Set(AREAS),
    initialized: false
  };

  // ===== DOM REFS =====
  const $ = id => document.getElementById(id);
  const statsBar = $('statsBar');
  const statusFilter = $('statusFilter');
  const toggleAllBtn = $('toggleAll');
  const grid = $('grid');

  // ===== RENDER STATS =====
  function renderStats() {
    const total = TASKS.length;
    const done = TASKS.filter(t => t.estado === "Completado").length;
    const inProgress = TASKS.filter(t => t.estado === "En curso").length;
    const blocked = TASKS.filter(t => t.estado === "Bloqueado").length;
    const pct = Math.round(done / total * 100);

    statsBar.innerHTML = `
      <div class="stat-card">
        <div class="stat-value">${total}</div>
        <div class="stat-label">Tareas totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="background:linear-gradient(180deg,#A3E635,#4FD1A5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${done}</div>
        <div class="stat-label">Completadas</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" style="background:linear-gradient(180deg,#FCA5A5,#F2995F);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${blocked}</div>
        <div class="stat-label">Bloqueadas</div>
      </div>
      <div class="stat-card stat-progress">
        <div class="progress-header">
          <span>Avance general</span>
          <strong>${pct}%</strong>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
    `;
  }

  // ===== RENDER FILTERS =====
  function renderFilters() {
    statusFilter.innerHTML = `
      <option value="Todos" ${state.filter === "Todos" ? "selected" : ""}>Todos los estados</option>
      ${STATUSES.map(s => `<option value="${s}" ${state.filter === s ? "selected" : ""}>${s}</option>`).join("")}
    `;
  }

  // ===== TOGGLE ALL =====
  function updateToggleLabel() {
    const allOpen = state.openAreas.size === AREAS.length;
    toggleAllBtn.innerHTML = allOpen
      ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg> Colapsar todo`
      : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg> Desplegar todo`;
  }

  function toggleAll() {
    const allOpen = state.openAreas.size === AREAS.length;
    if (allOpen) {
      state.openAreas.clear();
    } else {
      AREAS.forEach(a => state.openAreas.add(a));
    }
    renderGrid();
  }

  // ===== CYCLE STATUS =====
  function cycleStatus(id, btn) {
    const task = TASKS.find(t => t.id === id);
    if (!task) return;

    // Animate button
    btn.style.transform = 'scale(0.9)';
    setTimeout(() => btn.style.transform = '', 150);

    task.estado = STATUS_CYCLE[task.estado];
    renderStats();
    renderGrid();
  }

  // ===== RENDER GRID =====
  function renderGrid() {
    const fragment = document.createDocumentFragment();

    AREAS.forEach((area, areaIndex) => {
      const allTasks = TASKS.filter(t => t.area === area);
      const visibleTasks = allTasks.filter(t => state.filter === "Todos" || t.estado === state.filter);
      const doneCount = allTasks.filter(t => t.estado === "Completado").length;
      const pct = Math.round(doneCount / allTasks.length * 100);
      const config = AREA_CONFIG[area];
      const isOpen = state.openAreas.has(area);

      const card = document.createElement('div');
      card.className = `area-card ${isOpen ? 'open' : ''}`;
      card.style.cssText = `--accent-color:${config.color};--accent-color-glow:${config.glow}`;
      card.style.animationDelay = `${areaIndex * 0.05}s`;

      const header = document.createElement('div');
      header.className = 'area-header';
      header.innerHTML = `
        <span class="area-dot ${doneCount < allTasks.length ? 'pulse' : ''}"></span>
        <h3 class="area-title">${area}</h3>
        <div class="area-meta">
          <span class="area-count"><span>${doneCount}</span> / ${allTasks.length}</span>
          <svg class="area-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      `;

      const progress = document.createElement('div');
      progress.className = 'area-progress';
      progress.innerHTML = `<div class="area-progress-fill" style="width:${pct}%"></div>`;

      const list = document.createElement('div');
      list.className = 'task-list';

      const listInner = document.createElement('div');
      listInner.className = 'task-list-inner';

      if (visibleTasks.length === 0) {
        listInner.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><path d="M12 11v4M12 17h.01"/></svg>
            <div>Sin tareas con este filtro.</div>
          </div>
        `;
      } else {
        visibleTasks.forEach((task, i) => {
          const item = document.createElement('div');
          item.className = 'task-item';
          item.style.animationDelay = `${i * 0.03}s`;
          item.innerHTML = `
            <div class="task-content">
              <div class="task-title">${escapeHtml(task.tarea)}</div>
              <div class="task-meta">
                <span class="task-tag">S${task.s}–S${task.s + task.d - 1}</span>
                <span class="task-tag resp">${escapeHtml(task.resp)}</span>
              </div>
            </div>
            <button class="task-status ${STATUS_CLASS[task.estado]}" data-id="${task.id}" type="button">${task.estado}</button>
          `;
          const btn = item.querySelector('.task-status');
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            cycleStatus(task.id, btn);
          });
          listInner.appendChild(item);
        });
      }

      list.appendChild(listInner);
      card.appendChild(header);
      card.appendChild(progress);
      card.appendChild(list);

      // Toggle open/close
      header.addEventListener('click', () => {
        if (state.openAreas.has(area)) {
          state.openAreas.delete(area);
          card.classList.remove('open');
        } else {
          state.openAreas.add(area);
          card.classList.add('open');
        }
        updateToggleLabel();
      });

      fragment.appendChild(card);
    });

    grid.innerHTML = '';
    grid.appendChild(fragment);
    updateToggleLabel();
  }

  // ===== UTILS =====
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ===== EVENTS =====
  statusFilter.addEventListener('change', (e) => {
    state.filter = e.target.value;
    renderGrid();
  });

  toggleAllBtn.addEventListener('click', toggleAll);

  // ===== INIT =====
  renderStats();
  renderFilters();
  renderGrid();

  // Reveal animation on load
  requestAnimationFrame(() => {
    document.querySelectorAll('.grid .area-card').forEach((card, i) => {
      card.style.animationDelay = `${i * 0.05}s`;
    });
  });

})();
</script>

</body>
</html>
