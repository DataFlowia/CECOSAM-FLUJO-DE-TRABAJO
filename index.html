<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @property --angle{ syntax:'<angle>'; inherits:false; initial-value:0deg; }

  .pt2{
    --bg:#0A0A0B; --panel:#141417; --panel-2:#1B1B20; --text:#F2F1EC; --text-soft:#9A978C; --line:#26262C;
    --legal:#6FA8DC; --info:#4FD1A5; --fin:#A9D18E; --mkt:#F2A7C0; --com:#F2995F;
    --rrhh:#B9A6E8; --infra:#F0C46B; --gob:#B9B6AA;
    background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    padding:clamp(14px,4vw,28px); border-radius:14px;
  }
  .pt2 *{box-sizing:border-box}
  .pt2 h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(20px,4vw,27px);margin:0 0 2px}
  .pt2 .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-soft);margin:0 0 16px}

  .pt2-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .pt2-stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:88px}
  .pt2-stat .n{font-family:'Fraunces',serif;font-size:20px;font-weight:600;line-height:1}
  .pt2-stat .l{font-size:10.5px;color:var(--text-soft);margin-top:2px}
  .pt2-track{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;flex:1;min-width:120px;align-self:center}
  .pt2-track i{display:block;height:100%;background:var(--info);transition:width .4s}

  .pt2-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .pt2-filters select{
    font-family:'Inter';font-size:12px;padding:7px 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);
  }

  .pt2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}

  .pt2-card{position:relative;border-radius:14px;padding:1.5px;isolation:isolate}
  .pt2-card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;
    background:conic-gradient(from var(--angle,0deg),
      transparent 0deg, var(--accent) 40deg, transparent 90deg,
      transparent 180deg, var(--accent) 220deg, transparent 270deg, transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:.85;
  }
  @media (prefers-reduced-motion: no-preference){
    .pt2-card::before{ animation:pt2spin 7s linear infinite; }
  }
  @keyframes pt2spin{ to{ --angle:360deg; } }

  .pt2-card > details{
    position:relative;background:var(--panel);border-radius:12.5px;overflow:hidden;
  }
  .pt2-card summary{
    list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;
    -webkit-tap-highlight-color:transparent;
  }
  .pt2-card summary::-webkit-details-marker{display:none}
  .pt2-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  .pt2-card summary h3{margin:0;font-size:13.5px;font-weight:600;font-family:'Inter'}
  .pt2-card summary .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-soft);white-space:nowrap}
  .pt2-chev{transition:transform .25s ease;color:var(--text-soft);flex:none}
  .pt2-card details[open] .pt2-chev{transform:rotate(90deg)}

  .pt2-mini{height:4px;background:var(--panel-2);margin:0 14px 12px;border-radius:2px;overflow:hidden}
  .pt2-mini i{display:block;height:100%;background:var(--accent)}

  .pt2-list{padding:0 12px 12px}
  .pt2-item{
    background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;margin-bottom:7px;display:flex;align-items:center;gap:10px;
  }
  .pt2-item .txt{flex:1;min-width:0}
  .pt2-item .t{font-size:12.5px;line-height:1.4}
  .pt2-item .m{font-size:10.5px;color:var(--text-soft);margin-top:3px;font-family:'IBM Plex Mono',monospace}
  .pt2-status{
    font-size:10.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--text-soft);cursor:pointer;white-space:nowrap;font-family:'Inter';flex:none;
  }
  .pt2-status[data-s="Completado"]{background:#1D2B18;border-color:#3B5A2E;color:#9AD97F}
  .pt2-status[data-s="En curso"]{background:#132531;border-color:#2C5876;color:#7FC2E8}
  .pt2-status[data-s="Bloqueado"]{background:#301A18;border-color:#6B342E;color:#E89184}
  .pt2-empty{font-size:12px;color:var(--text-soft);padding:14px;text-align:center}

  @media (max-width:480px){
    .pt2-summary{gap:8px}
    .pt2-stat{min-width:74px;padding:8px 10px}
    .pt2-item{flex-wrap:wrap}
    .pt2-status{margin-left:auto}
  }
</style>
<div class="pt2" id="pt2Root">
  <p class="eyebrow">Centro de exalumnos · Semanas 1–16</p>
  <h1>Plan de tareas</h1>
  <div class="pt2-summary" id="pt2Summary"></div>
  <div class="pt2-filters" id="pt2Filters"></div>
  <div class="pt2-grid" id="pt2Grid"></div>
</div>
<script>
(function(){
  const TASKS = [
   {area:"Legal",tarea:"Definir tipo de entidad y estructura legal (fundación, corporación, asociación)",resp:"Abogado",s:1,d:1,estado:"Pendiente"},
   {area:"Legal",tarea:"Redactar estatutos y escritura pública",resp:"Abogado",s:2,d:2,estado:"Pendiente"},
   {area:"Legal",tarea:"Inscribir la entidad y obtener RUT / personalidad jurídica",resp:"Abogado / Contador",s:4,d:1,estado:"Pendiente"},
   {area:"Legal",tarea:"Tramitar permisos municipales",resp:"Encargado legal",s:5,d:1,estado:"Pendiente"},
   {area:"Legal",tarea:"Regularizar situación tributaria (inicio de actividades, régimen)",resp:"Contador",s:5,d:1,estado:"Pendiente"},

   {area:"Informática",tarea:"Contratar dominio y hosting",resp:"TI",s:3,d:1,estado:"Pendiente"},
   {area:"Informática",tarea:"Configurar correo institucional",resp:"TI",s:3,d:1,estado:"Pendiente"},
   {area:"Informática",tarea:"Diseñar y publicar sitio web",resp:"TI / Diseñador",s:4,d:3,estado:"Pendiente"},
   {area:"Informática",tarea:"Construir base de datos de exalumnos",resp:"TI",s:4,d:2,estado:"Pendiente"},
   {area:"Informática",tarea:"Desarrollar app / formulario de censo",resp:"TI",s:6,d:2,estado:"Pendiente"},

   {area:"Finanzas",tarea:"Abrir cuenta bancaria institucional",resp:"Tesorero",s:4,d:1,estado:"Pendiente"},
   {area:"Finanzas",tarea:"Elaborar presupuesto de gastos e ingresos",resp:"Contador",s:5,d:2,estado:"Pendiente"},
   {area:"Finanzas",tarea:"Proyectar flujo de caja (12-24 meses)",resp:"Contador",s:6,d:2,estado:"Pendiente"},
   {area:"Finanzas",tarea:"Definir política de cuotas y donaciones",resp:"Directorio",s:7,d:1,estado:"Pendiente"},
   {area:"Finanzas",tarea:"Implementar sistema contable",resp:"Contador",s:7,d:2,estado:"Pendiente"},

   {area:"Recursos humanos",tarea:"Mapear especialistas requeridos por área",resp:"Directorio",s:1,d:1,estado:"Pendiente"},
   {area:"Recursos humanos",tarea:"Definir perfiles y dedicación (full-time / part-time / voluntario)",resp:"RRHH",s:2,d:1,estado:"Pendiente"},
   {area:"Recursos humanos",tarea:"Contratar coordinador general",resp:"RRHH",s:3,d:2,estado:"Pendiente"},
   {area:"Recursos humanos",tarea:"Contratar contador y asesor legal",resp:"RRHH",s:3,d:2,estado:"Pendiente"},
   {area:"Recursos humanos",tarea:"Contratar community manager",resp:"RRHH",s:6,d:2,estado:"Pendiente"},

   {area:"Marketing",tarea:"Definir identidad de marca",resp:"Marketing",s:6,d:2,estado:"Pendiente"},
   {area:"Marketing",tarea:"Seleccionar redes sociales prioritarias",resp:"Marketing",s:7,d:1,estado:"Pendiente"},
   {area:"Marketing",tarea:"Crear plan de contenidos",resp:"Marketing",s:8,d:1,estado:"Pendiente"},
   {area:"Marketing",tarea:"Configurar canales de comunicación (newsletter, WhatsApp)",resp:"Marketing",s:8,d:2,estado:"Pendiente"},
   {area:"Marketing",tarea:"Lanzar campaña de difusión inicial",resp:"Marketing",s:9,d:2,estado:"Pendiente"},

   {area:"Comercialización",tarea:"Definir catálogo de productos (charlas, talleres)",resp:"Coordinador",s:9,d:2,estado:"Pendiente"},
   {area:"Comercialización",tarea:"Establecer alianzas para bolsa de empleo",resp:"Coordinador",s:10,d:2,estado:"Pendiente"},
   {area:"Comercialización",tarea:"Diseñar programa de mentorías",resp:"Coordinador",s:11,d:2,estado:"Pendiente"},
   {area:"Comercialización",tarea:"Definir membresías premium",resp:"Directorio",s:11,d:1,estado:"Pendiente"},
   {area:"Comercialización",tarea:"Planificar primer evento de networking",resp:"Coordinador",s:12,d:2,estado:"Pendiente"},

   {area:"Infraestructura",tarea:"Definir necesidad de oficina / espacio físico",resp:"Directorio",s:1,d:1,estado:"Pendiente"},
   {area:"Infraestructura",tarea:"Buscar y contratar el espacio",resp:"Administración",s:2,d:2,estado:"Pendiente"},
   {area:"Infraestructura",tarea:"Adquirir equipamiento (PC, mobiliario)",resp:"Administración",s:4,d:1,estado:"Pendiente"},
   {area:"Infraestructura",tarea:"Instalar servicios básicos e internet",resp:"Administración",s:4,d:1,estado:"Pendiente"},
   {area:"Infraestructura",tarea:"Habilitar señalética e imagen del espacio",resp:"Administración",s:5,d:1,estado:"Pendiente"},

   {area:"Gobernanza / Otros",tarea:"Constituir comité / mesa directiva",resp:"Directorio",s:1,d:1,estado:"Pendiente"},
   {area:"Gobernanza / Otros",tarea:"Establecer alianza con la universidad de origen",resp:"Directorio",s:2,d:3,estado:"Pendiente"},
   {area:"Gobernanza / Otros",tarea:"Definir plan de sostenibilidad a largo plazo",resp:"Directorio",s:12,d:3,estado:"Pendiente"},
   {area:"Gobernanza / Otros",tarea:"Revisión y ajuste general del proyecto",resp:"Directorio",s:15,d:2,estado:"Pendiente"},
   {area:"Gobernanza / Otros",tarea:"Lanzamiento oficial del centro de exalumnos",resp:"Directorio",s:16,d:1,estado:"Pendiente"},
  ].map((t,i)=>Object.assign({id:i},t));

  const VARMAP = {
    "Legal":"--legal","Informática":"--info","Finanzas":"--fin","Marketing":"--mkt",
    "Comercialización":"--com","Recursos humanos":"--rrhh","Infraestructura":"--infra","Gobernanza / Otros":"--gob"
  };
  const AREAS = [...new Set(TASKS.map(t=>t.area))];
  const STATUSES = ["Pendiente","En curso","Completado","Bloqueado"];
  const CYCLE = {"Pendiente":"En curso","En curso":"Completado","Completado":"Bloqueado","Bloqueado":"Pendiente"};

  const state = { status: "Todos", open: new Set(AREAS) };

  const summaryEl = document.getElementById('pt2Summary');
  const filtersEl = document.getElementById('pt2Filters');
  const gridEl = document.getElementById('pt2Grid');

  function renderSummary(){
    const total = TASKS.length;
    const done = TASKS.filter(t=>t.estado==="Completado").length;
    const pct = Math.round(done/total*100);
    summaryEl.innerHTML = `
      <div class="pt2-stat"><div class="n">${total}</div><div class="l">tareas</div></div>
      <div class="pt2-stat"><div class="n">${done}</div><div class="l">completadas</div></div>
      <div class="pt2-stat"><div class="n">${pct}%</div><div class="l">avance</div></div>
      <div class="pt2-track"><i style="width:${pct}%"></i></div>
    `;
  }

  function renderFilters(){
    filtersEl.innerHTML = `
      <select id="pt2StatusSel" aria-label="Filtrar por estado">
        <option ${state.status==="Todos"?"selected":""}>Todos</option>
        ${STATUSES.map(s=>`<option ${state.status===s?"selected":""}>${s}</option>`).join("")}
      </select>
    `;
    document.getElementById('pt2StatusSel').addEventListener('change', e=>{
      state.status = e.target.value; renderGrid();
    });
  }

  function cycleStatus(id){
    const t = TASKS.find(x=>x.id===id);
    t.estado = CYCLE[t.estado];
    renderSummary(); renderGrid();
  }

  function renderGrid(){
    const cards = AREAS.map(area=>{
      const items = TASKS.filter(t=>t.area===area && (state.status==="Todos" || t.estado===state.status));
      const allInArea = TASKS.filter(t=>t.area===area);
      const done = allInArea.filter(t=>t.estado==="Completado").length;
      const pct = Math.round(done/allInArea.length*100);
      const openAttr = state.open.has(area) ? "open" : "";
      const varName = VARMAP[area];
      const body = items.length
        ? items.map(t=>`
            <div class="pt2-item">
              <div class="txt">
                <div class="t">${t.tarea}</div>
                <div class="m">S${t.s}–S${t.s+t.d-1} · ${t.resp}</div>
              </div>
              <button class="pt2-status" data-s="${t.estado}" data-id="${t.id}">${t.estado}</button>
            </div>`).join("")
        : `<div class="pt2-empty">Sin tareas con este filtro.</div>`;
      return `
        <div class="pt2-card" style="--accent:var(${varName})">
          <details ${openAttr} data-area="${area}">
            <summary>
              <span class="pt2-dot"></span>
              <h3>${area}</h3>
              <span class="count">${done}/${allInArea.length}</span>
              <svg class="pt2-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </summary>
            <div class="pt2-mini"><i style="width:${pct}%"></i></div>
            <div class="pt2-list">${body}</div>
          </details>
        </div>`;
    }).join("");
    gridEl.innerHTML = cards;

    gridEl.querySelectorAll('details').forEach(d=>{
      d.addEventListener('toggle', ()=>{
        const a = d.dataset.area;
        if(d.open) state.open.add(a); else state.open.delete(a);
      });
    });
    gridEl.querySelectorAll('.pt2-status').forEach(b=>{
      b.addEventListener('click', (e)=>{ e.preventDefault(); cycleStatus(Number(b.dataset.id)); });
    });
  }

  renderSummary(); renderFilters(); renderGrid();
})();
</script>
